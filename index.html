    <script>
        const API_URL = "https://lemes-chat-api.onrender.com/chat";
        const chatBox = document.getElementById("chat-box");
        const chatMessages = document.getElementById("chat-messages");
        const chatInput = document.getElementById("chat-input");
        const chatSendBtn = document.getElementById("chat-send-btn");
        const chatToggleBtn = document.getElementById("chat-toggle-btn");
        const chatCloseBtn = document.getElementById("chat-close-btn");

        let messages = [];
        let isOpen = false;
        let isLoading = false;

        function toggleChat() {
            isOpen = !isOpen;
            chatBox.classList.toggle("hidden", !isOpen);
            if (isOpen && messages.length === 0) {
                addBotMessage("Olá! 👋 Seja bem-vindo à **Lemes & Associados**.\n\nSou o assistente jurídico virtual do escritório. Posso orientá-lo sobre nossas áreas de atuação e agendar uma consulta com o Dr. Diego Lemes.\n\nComo posso ajudá-lo hoje?");
            }
        }

        chatToggleBtn.addEventListener("click", toggleChat);
        chatCloseBtn.addEventListener("click", toggleChat);

        function addBotMessage(text) {
            messages.push({ role: "assistant", content: text });
            renderMessages();
        }

        function renderMessages() {
            chatMessages.innerHTML = "";
            messages.forEach(m => {
                const isUser = m.role === "user";
                const div = document.createElement("div");
                div.className = "chat-msg " + (isUser ? "user" : "bot");
                const formatted = m.content
                    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                    .replace(/\n/g, "<br>");
                div.innerHTML = '<div class="chat-msg-avatar">' + (isUser ? "👤" : "⚖️") + '</div><div class="chat-bubble">' + formatted + '</div>';
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "chat-msg bot";
            div.id = "typing-indicator";
            div.innerHTML = '<div class="chat-msg-avatar">⚖️</div><div class="chat-typing"><span></span><span></span><span></span></div>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById("typing-indicator");
            if (t) t.remove();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isLoading) return;
            messages.push({ role: "user", content: text });
            chatInput.value = "";
            chatInput.style.height = "auto";
            renderMessages();
            isLoading = true;
            chatSendBtn.disabled = true;
            showTyping();
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages })
                });
                const data = await res.json();
                hideTyping();
                if (data.reply) {
                    messages.push({ role: "assistant", content: data.reply });
                    renderMessages();
                }
            } catch (e) {
                hideTyping();
                messages.push({ role: "assistant", content: "Desculpe, ocorreu um erro. Entre em contato pelo WhatsApp: (11) 99515-5021" });
                renderMessages();
            } finally {
                isLoading = false;
                chatSendBtn.disabled = false;
            }
        }

        chatSendBtn.addEventListener("click", sendMessage);
        chatInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        chatInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 80) + "px";
        });
    </script>
